
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mangalore City Bus Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#172b3a}
header{background:#123b5d;color:white;padding:20px 15px}
.wrap{max-width:900px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:20px;font-weight:bold}
main{padding:18px 12px}
.card{background:white;padding:16px;border:1px solid #dbe5ec;border-radius:14px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.grid.two{grid-template-columns:1fr 1fr}}
label{display:block;font-weight:bold;margin-bottom:6px}
input,textarea{width:100%;padding:12px;border:1px solid #cbd7e0;border-radius:9px;font:inherit}
.field{margin-bottom:12px}
button{background:#1769aa;color:white;border:0;padding:11px 14px;border-radius:9px;font-weight:bold;cursor:pointer}
.secondary{background:#e8eef3;color:#123b5d}
.danger{background:#a92c35}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.results-head,.route-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:#617383;font-size:14px}
.route{border:1px solid #dbe5ec;border-radius:12px;padding:13px;margin-top:10px;overflow-wrap:anywhere}
.badge{background:#eaf4fb;color:#123b5d;padding:5px 8px;border-radius:20px;font-size:13px}
.stops{padding-left:22px}
.stops li{padding:3px}
.empty{background:#f8fafc;padding:18px;text-align:center;border-radius:10px}
.hidden{display:none!important}
.tabs,.route-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
textarea{min-height:75px}
</style>
</head>
<body>
<header>
<div class="wrap top">
<div class="brand">🚌 MANGALORE CITY BUS FINDER</div>
<button class="secondary" id="adminToggle" type="button">Admin</button>
</div>
</header>

<main class="wrap">
<section class="card">
<form id="searchForm">
<div class="grid two">
<div class="field">
<label for="from">From</label>
<input id="from" list="places" placeholder="Starting bus stop" required>
</div>
<div class="field">
<label for="to">To</label>
<input id="to" list="places" placeholder="Destination bus stop" required>
</div>
</div>
<datalist id="places"></datalist>
<button type="submit">Search</button>
</form>
</section>

<section class="card">
<div class="results-head">
<h2 id="resultsTitle">Bus Routes</h2>
<span id="routeCount" class="muted"></span>
</div>
<div id="results"></div>
</section>

<section id="adminSection" class="card hidden">
<h2>Admin</h2>
<div class="tabs">
<button id="addTab">Add route</button>
<button class="secondary" id="dataTab">Import / export</button>
</div>

<div id="addPanel">
<form id="routeForm">
<input type="hidden" id="editId">
<div class="grid two">
<div class="field"><label for="number">Bus number</label><input id="number" required></div>
<div class="field"><label for="name">Route name</label><input id="name" required></div>
</div>
<div class="grid two">
<div class="field"><label for="start">Starting stop</label><input id="start" required></div>
<div class="field"><label for="end">Destination stop</label><input id="end" required></div>
</div>
<div class="field">
<label for="stops">Stops in order (separate with commas)</label>
<textarea id="stops" required></textarea>
</div>
<div class="grid two">
<div class="field"><label for="timings">Timings</label><input id="timings"></div>
<div class="field"><label for="duration">Journey duration</label><input id="duration"></div>
</div>
<div class="actions">
<button type="submit" id="saveRoute">Save route</button>
<button class="secondary" type="button" id="cancelEdit">Clear</button>
</div>
</form>
<h3>Manage routes</h3>
<div id="adminRoutes"></div>
</div>

<div id="dataPanel" class="hidden">
<div class="actions">
<button id="exportBtn" type="button">Export routes</button>
<button class="secondary" id="resetBtn" type="button">Restore demo routes</button>
</div>
<div class="field">
<label for="importFile">Import routes JSON</label>
<input type="file" id="importFile" accept=".json,application/json">
</div>
</div>
</section>
</main>

<script>
const DEMO=[
{id:"1",number:"DEMO-01",name:"Central route",start:"State Bank",end:"Mangaladevi",stops:["State Bank","Hampankatta","Car Street","Mangaladevi"],timings:"Not verified",duration:""},
{id:"2",number:"DEMO-02",name:"North route",start:"State Bank",end:"Kottara",stops:["State Bank","Hampankatta","Lady Hill","Kottara"],timings:"Not verified",duration:""},
{id:"3",number:"DEMO-03",name:"Surathkal route",start:"Hampankatta",end:"Surathkal",stops:["Hampankatta","State Bank","Kuloor","Surathkal"],timings:"Not verified",duration:""}
];
const KEY="mangaloreBusFinderRoutesV1";
function load(){
 try{
 const d=JSON.parse(localStorage.getItem(KEY));
 return Array.isArray(d)?d:DEMO.map(r=>({...r,stops:[...r.stops]}));
 }catch(e){return DEMO.map(r=>({...r,stops:[...r.stops]}))}
}
let routes=load();
const $=id=>document.getElementById(id);
const norm=s=>String(s||"").trim().toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){
 localStorage.setItem(KEY,JSON.stringify(routes));
 refreshPlaces();render(routes);renderAdmin();
}
function refreshPlaces(){
 const p=[...new Set(routes.flatMap(r=>[r.start,r.end,...r.stops]).filter(Boolean))];
 $("places").innerHTML=p.map(x=>`<option value="${esc(x)}">`).join("");
}
function card(r,admin=false){
 return `<article class="route">
 <div class="route-title"><strong>${esc(r.name||r.number)}</strong>
 <span class="badge">${esc(r.start)} → ${esc(r.end)}</span></div>
 <div class="muted">Route ${esc(r.number)}</div>
 <ol class="stops">${(r.stops||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
 ${r.timings?`<div class="muted">Timings: ${esc(r.timings)}</div>`:""}
 ${r.duration?`<div class="muted">Duration: ${esc(r.duration)}</div>`:""}
 ${admin?`<div class="route-actions">
 <button type="button" onclick="editRoute('${esc(r.id)}')">Edit</button>
 <button type="button" class="danger" onclick="deleteRoute('${esc(r.id)}')">Delete</button>
 </div>`:""}
 </article>`;
}
function render(list,title="Bus Routes"){
 $("resultsTitle").textContent=title;
 $("routeCount").textContent=list.length+" route(s)";
 $("results").innerHTML=list.length?list.map(r=>card(r)).join(""):'<div class="empty">No matching routes found.</div>';
}
function renderAdmin(){
 $("adminRoutes").innerHTML=routes.length?routes.map(r=>card(r,true)).join(""):'<div class="empty">No routes</div>';
}
function search(from,to){
 const f=norm(from),t=norm(to);
 if(!f||!t){render([]);return}
 if(f===t){render([],"Search Results");return}
 const found=routes.filter(r=>{
 const stops=(r.stops||[]).map(norm);
 const a=stops.indexOf(f),b=stops.indexOf(t);
 return a>=0&&b>=0&&a<b;
 });
 render(found,from+" → "+to);
}
$("searchForm").addEventListener("submit",e=>{
 e.preventDefault();search($("from").value,$("to").value);
});
$("adminToggle").onclick=()=>{
 $("adminSection").classList.toggle("hidden");
};
$("addTab").onclick=()=>{
 $("addPanel").classList.remove("hidden");
 $("dataPanel").classList.add("hidden");
};
$("dataTab").onclick=()=>{
 $("dataPanel").classList.remove("hidden");
 $("addPanel").classList.add("hidden");
};
$("routeForm").addEventListener("submit",e=>{
 e.preventDefault();
 const id=$("editId").value||"r"+Date.now();
 const stops=$("stops").value.split(",").map(s=>s.trim()).filter(Boolean);
 if(stops.length<2){alert("Enter at least two stops");return}
 const r={
 id,number:$("number").value.trim(),name:$("name").value.trim(),
 start:$("start").value.trim(),end:$("end").value.trim(),
 stops,timings:$("timings").value.trim(),duration:$("duration").value.trim()
 };
 const i=routes.findIndex(x=>x.id===id);
 if(i>=0)routes[i]=r;else routes.push(r);
 save();e.target.reset();$("editId").value="";
 $("saveRoute").textContent="Save route";
 alert("Route saved on this device");
});
window.editRoute=id=>{
 const r=routes.find(x=>x.id===id);if(!r)return;
 ["number","name","start","end","timings","duration"].forEach(k=>$(k).value=r[k]||"");
 $("stops").value=r.stops.join(", ");
 $("editId").value=r.id;
 $("saveRoute").textContent="Update route";
 $("addPanel").classList.remove("hidden");
 $("dataPanel").classList.add("hidden");
 $("routeForm").scrollIntoView({behavior:"smooth"});
};
window.deleteRoute=id=>{
 if(confirm("Delete this route?")){
 routes=routes.filter(r=>r.id!==id);save();
 }
};
$("cancelEdit").onclick=()=>{
 $("routeForm").reset();$("editId").value="";
 $("saveRoute").textContent="Save route";
};
$("exportBtn").onclick=()=>{
 const blob=new Blob([JSON.stringify(routes,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="mangalore-bus-routes.json";a.click();
 URL.revokeObjectURL(url);
};
$("importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
 const data=JSON.parse(await file.text());
 if(!Array.isArray(data)||!data.every(r=>r.number&&r.start&&r.end&&Array.isArray(r.stops)))throw Error();
 routes=data.map((r,i)=>({...r,id:r.id||"import"+Date.now()+i}));
 save();alert("Routes imported");
 }catch(err){alert("Invalid routes file")}
 e.target.value="";
});
$("resetBtn").onclick=()=>{
 if(confirm("Restore the sample routes?")){
 routes=DEMO.map(r=>({...r,stops:[...r.stops]}));save();
 }
};
refreshPlaces();
render(routes);
renderAdmin();
</script>
</body>
</html>
